<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171828">
  <title>HFLedger decision deck</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.png" type="image/png">
  <link rel="stylesheet" href="/app.css">
</head>
<body class="deck-page">
  <header class="deck-topbar">
    <a class="deck-back" href="/" aria-label="Back to board">←</a>
    <div class="deck-heading"><strong id="deck-brand">HFLedger</strong><span id="deck-progress">Decision deck</span></div>
    <select id="deck-context" aria-label="Active context"></select>
  </header>

  <main class="deck-shell">
    <section id="deck-loading" class="deck-state" role="status">
      <span class="spinner light" aria-hidden="true"></span>
      Preparing the owner lane…
    </section>
    <section id="deck-error" class="deck-state error" role="alert" hidden></section>
    <section id="deck-empty" class="deck-state empty" hidden>
      <span id="deck-empty-icon" class="empty-orbit" aria-hidden="true">✓</span>
      <h1 id="deck-empty-title">The lane is clear.</h1>
      <p id="deck-empty-copy">No admitted asks need your attention in this context.</p>
      <a class="button light-button" href="/">Return to board</a>
    </section>

    <section id="deck-stage" class="deck-stage" hidden>
      <div class="stack-card stack-two" aria-hidden="true"></div>
      <div class="stack-card stack-one" aria-hidden="true"></div>
      <article id="active-card" class="decision-card"></article>
      <p class="swipe-hint"><span>← Need more info</span><span>Accept / complete →</span></p>
    </section>
  </main>

  <div id="deck-toast" class="toast deck-toast" role="status" aria-live="polite" hidden></div>
  <script src="/deck.js" defer></script>
</body>
</html>
