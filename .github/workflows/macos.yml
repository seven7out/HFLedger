name: Mac app candidate

on:
  workflow_dispatch:
    inputs:
      publish_signed_draft:
        description: Build, notarize, and create a signed draft release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  candidate:
    name: Ad-hoc Apple Silicon candidate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          architecture: arm64
      - name: Set up Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: native/macos-host/package-lock.json
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: native/macos-host/src-tauri -> target
      - name: Install locked frontend dependencies
        working-directory: native/macos-host
        run: npm ci
      - name: Build and verify the ad-hoc DMG
        working-directory: native/macos-host
        run: npm run build:dmg
      - name: Upload candidate and manifest
        uses: actions/upload-artifact@v7
        with:
          name: HFLedger-macOS-arm64-candidate
          if-no-files-found: error
          path: |
            native/macos-host/src-tauri/target/release/bundle/dmg/*.dmg
            native/macos-host/src-tauri/target/release/bundle/release-manifest.json

  signed-draft:
    name: Developer ID signed and notarized draft
    if: inputs.publish_signed_draft
    needs: candidate
    runs-on: macos-latest
    timeout-minutes: 40
    environment: macos-release
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          architecture: arm64
      - name: Set up Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: native/macos-host/package-lock.json
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: native/macos-host/src-tauri -> target
      - name: Install locked frontend dependencies
        working-directory: native/macos-host
        run: npm ci
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
      - name: Build, sign, notarize, and staple
        working-directory: native/macos-host
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 scripts/build_tauri.py --bundles app,dmg
      - name: Verify notarization and emit manifest
        working-directory: native/macos-host
        run: python3 scripts/verify_release.py --require-notarized
      - name: Create attended draft release
        working-directory: native/macos-host
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          gh release create "mac-v$VERSION" \
            src-tauri/target/release/bundle/dmg/*.dmg \
            src-tauri/target/release/bundle/release-manifest.json \
            --target "$GITHUB_SHA" \
            --title "HFLedger for Mac v$VERSION" \
            --notes "Signed and notarized HFLedger for Apple Silicon. Review this draft and its manifest before publishing." \
            --draft \
            --prerelease
